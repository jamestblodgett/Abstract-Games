<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Format</title>
        <link rel="icon" type="image/png" href="icon.png">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            #gameCanvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            footer {
                color: #767676;
                position: absolute;
                bottom: 0;
                width: 100%;
                background-color: rgba(255, 255, 255, 0.8);
                padding: 10px 0;
                z-index: 10;
            }
        </style>

    </head>
    <body>
        <canvas id="gameCanvas"></canvas>
        <footer>
            <p id="footerText" style="text-align: center;">Updated: ${GAME_CONFIG.lastUpdate}, version ${GAME_CONFIG.version}</p>
        </footer>
    </body>
    <script type="module">
        import { GAME_CONFIG } from './config.js';

        console.log(`Game Version: ${GAME_CONFIG.version}, Last Update: ${GAME_CONFIG.lastUpdate}`);

        // Modify this to apply to the area where you add the variables
        const footer = document.getElementById("footerText");
        footer.textContent = `Updated: ${GAME_CONFIG.lastUpdate}, version ${GAME_CONFIG.version}`;
    </script>
</html>
<script src="base.js"></script>
<!-- Change this to the js file you need -->
</html>
